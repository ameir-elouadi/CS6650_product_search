# Product API + Prometheus + Grafana, all local.
#   docker compose up --build -d
# API: http://localhost:8080   Prometheus: http://localhost:9090   Grafana: http://localhost:3000

services:
  app:
    build: ../src
    platform: linux/amd64
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./targets:/etc/prometheus/targets:ro
    depends_on:
      - app

  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "3000:3000"
    environment:
      # Local only: open straight to the dashboard, no login
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/product-api.json
      # PNG export of dashboards/panels via /render (used for report screenshots)
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  renderer:
    image: grafana/grafana-image-renderer:v4.0.10
